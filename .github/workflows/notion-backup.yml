# seoyeon notion data backup
name: Notion Backup

on:
  schedule:
    - cron: "50 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run backup script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 scripts/notion_backup.py
      - name: Commit and push if changed
        run: |
          git config user.name "seoyeon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backups/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily Notion backup $(date -u +%Y-%m-%d)"
            git push
          fi
