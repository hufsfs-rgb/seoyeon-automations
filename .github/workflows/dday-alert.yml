# seoyeon D-day countdown alert
name: D-day Alert

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check D-day and push if matched
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 scripts/dday_check.py
