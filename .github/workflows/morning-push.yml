# seoyeon morning briefing push notification (+ weather)
name: Morning Briefing Push

on:
  schedule:
    - cron: "35 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check weather (best-effort)
        continue-on-error: true
        run: python3 scripts/weather_check.py
      - name: Send ntfy push notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 scripts/send_morning_push.py
      - name: Commit weather history if changed
        run: |
          git config user.name "seoyeon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/weather-history.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update weather history $(date -u +%Y-%m-%d)"
            git push
          fi
