# seoyeon weekly retrospective push notification
name: Weekly Retro Push

on:
  schedule:
    # Mon 07:50 KST - the retro routine now runs Mon 00:10 KST so Sunday's diary is included
    - cron: "50 22 * * 0"
  workflow_dispatch: {}

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Send ntfy push notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          cat > payload.json <<'EOF'
          {
            "topic": "${{ secrets.NTFY_TOPIC }}",
            "title": "서연의 주간 회고 🗓️",
            "message": "이번 주 회고가 준비됐어요! 노션에서 확인해주세요 :)"
          }
          EOF
          curl -sS -X POST https://ntfy.sh \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @payload.json
      - uses: actions/checkout@v4
      - name: Log alert to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 scripts/alert_log.py "주간리포트" "서연의 주간 회고 🗓️" "지난주 주간 회고 알림 발송"
